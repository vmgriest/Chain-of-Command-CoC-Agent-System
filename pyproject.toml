[project]
name = "chain-of-command"
version = "0.1.0"
description = "Four-tier escalating support agent system built on LangGraph"
requires-python = ">=3.11"

# NOTE: nothing is installed yet. Run `uv sync` when ready to start M1.
dependencies = [
    # --- orchestration (M1) ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    # --- api (M1) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # --- rag (M2) ---
    "qdrant-client>=1.12.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    # --- mcp (M3) ---
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    # --- notifications (M4) ---
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101: asserts are fine in tests. TODO(M5): tighten once the suite is real.
ignore = ["S101"]

[tool.mypy]
# Matches the interpreter `uv` actually pins (.venv is cpython-3.12) rather
# than the >=3.11 floor in [project] — qdrant-client (M2) pulls in numpy as a
# transitive dependency, and numpy's shipped stubs use PEP 695 `type X = ...`
# syntax that only parses under 3.12+.
python_version = "3.12"
strict = true
warn_return_any = true
# TODO(M1): drop this once the third-party stubs situation settles.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
