# Local dev infrastructure. Backend and frontend run on the host during development.
#
# Usage: docker compose up -d
#
# backend/mcp/internal_server.py is NOT declared here — it runs on the host
# via `uv run python -m backend.mcp.internal_server --port 9001`, same as the
# main API process, since it's first-party code with the same dependencies.
# Only the sandboxed MCP runner network is a TODO:
# TODO(M3+): an internal-only bridge network for backend/mcp/sandbox.py's
#           spawned containers, with egress restricted to the endpoints
#           declared in company_config.json (see MCP_SERVER_POLICY.allowed_egress).

services:
  # The vector database backend/rag/ingest.py writes embeddings into and
  # backend/rag/retriever.py searches — the only piece of infra this repo
  # actually needs containerized (Ollama runs natively for GPU access).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: coc-qdrant
    ports:
      - "6333:6333" # REST API — what qdrant-client talks to
      - "6334:6334" # gRPC API — faster, unused by this project but exposed anyway
    volumes:
      # Persists Qdrant's data outside the container so `docker compose down`
      # doesn't wipe every ingested document.
      - ./qdrant_storage:/qdrant/storage
    # Restarts automatically after a crash or host reboot, but not after a
    # manual `docker compose stop`.
    restart: unless-stopped

  # Ollama runs on the host by default (better GPU access on Windows).
  # Uncomment to containerize instead — then set OLLAMA_BASE_URL=http://ollama:11434
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: coc-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   restart: unless-stopped

# TODO(M2/M3): the code-execution sandbox and stdio MCP servers are spawned
#   on demand by backend/mcp/sandbox.py, not declared here — they are per-session
#   containers with dropped capabilities, not long-lived services.
